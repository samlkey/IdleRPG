<div class="page">
  <div class="glow-orb glow-orb--left"></div>
  <div class="glow-orb glow-orb--right"></div>

  <header class="header">
    <button class="back-btn" (click)="back()" aria-label="Back to character select">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      Back
    </button>
    <h1 class="page-title">Create Character</h1>
    <div class="spacer"></div>
  </header>

  <main class="creation-area">

    <!-- Name -->
    <section class="name-section">
      <label class="name-label" for="char-name">Character Name</label>
      <input
        id="char-name"
        class="name-input"
        type="text"
        placeholder="Enter a name…"
        maxlength="24"
        autocomplete="off"
        spellcheck="false"
        [(ngModel)]="name"
      />
      <span class="name-hint" [class.name-hint--error]="name().length > 0 && name().trim().length < 2">
        {{ name().trim().length < 2 ? 'At least 2 characters required' : '&nbsp;' }}
      </span>
    </section>

    <!-- Game mode -->
    <section class="mode-section">
      <h2 class="mode-heading">Choose Game Mode</h2>
      <div class="mode-grid">

        <!-- Classic -->
        <button
          class="mode-banner mode-banner--classic"
          [class.mode-banner--selected]="mode() === 'classic'"
          (click)="selectMode('classic')"
          type="button"
          aria-pressed="mode() === 'classic'"
        >
          <div class="mode-banner__glow"></div>
          <div class="mode-banner__icon" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 3L4 9v7c0 7 5.3 13.1 12 14.9C22.7 29.1 28 23 28 16V9L16 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M11 16l3 3 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="mode-banner__body">
            <span class="mode-banner__name">Classic</span>
            <p class="mode-banner__desc">The standard experience. Death is a setback, not the end. Grow your skills, explore the world, and build your legend at your own pace.</p>
            <ul class="mode-banner__perks">
              <li>Respawn on death</li>
              <li>Full skill progression</li>
              <li>All content accessible</li>
            </ul>
          </div>
          @if (mode() === 'classic') {
            <div class="mode-banner__check" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 3.5L6 11 2.5 7.5l-1 1L6 13l8.5-8.5-1-1z"/></svg>
            </div>
          }
        </button>

        <!-- Hardcore -->
        <button
          class="mode-banner mode-banner--hardcore"
          [class.mode-banner--selected]="mode() === 'hardcore'"
          (click)="selectMode('hardcore')"
          type="button"
          aria-pressed="mode() === 'hardcore'"
        >
          <div class="mode-banner__glow"></div>
          <div class="mode-banner__icon" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 4l2.5 7.5H26l-6.3 4.6 2.4 7.4L16 19.2 9.9 23.5l2.4-7.4L6 11.5h7.5L16 4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="mode-banner__body">
            <span class="mode-banner__name">Hardcore</span>
            <p class="mode-banner__desc">One life. No second chances. Death is permanent — your hero's story ends the moment they fall. Only the worthy survive.</p>
            <ul class="mode-banner__perks">
              <li>Permanent death</li>
              <li>Exclusive leaderboard</li>
              <li>Hardcore-only rewards</li>
            </ul>
          </div>
          @if (mode() === 'hardcore') {
            <div class="mode-banner__check" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 3.5L6 11 2.5 7.5l-1 1L6 13l8.5-8.5-1-1z"/></svg>
            </div>
          }
        </button>

      </div>
    </section>

    <!-- Create button -->
    <button
      class="create-btn"
      [class.create-btn--hardcore]="mode() === 'hardcore'"
      [disabled]="!canCreate"
      (click)="create()"
    >
      <span>Begin Your Journey</span>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>

  </main>
</div>
