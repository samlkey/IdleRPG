<button
  class="activity-card"
  [class.activity-card--disabled]="disabled()"
  [class.activity-card--depleted]="isDepleted"
  [class.activity-card--active]="active() && !isCrit() && !isCaught()"
  [class.activity-card--crit]="isCrit()"
  [class.activity-card--caught]="isCaught()"
  [disabled]="disabled()"
  (click)="onClick()"
  type="button"
>

  <!-- Crit overlay -->
  @if (isCrit()) {
    <div class="activity-card__crit-overlay" aria-live="polite">
      <!-- Countdown ring -->
      <div class="activity-card__crit-ring-wrap">
        <svg class="activity-card__crit-ring" viewBox="0 0 52 52" aria-hidden="true">
          <!-- Track -->
          <circle cx="26" cy="26" r="22" fill="none" stroke="rgba(245,158,11,0.15)" stroke-width="4"/>
          <!-- Countdown arc -->
          <circle cx="26" cy="26" r="22" fill="none"
            stroke="#fbbf24" stroke-width="4"
            stroke-linecap="round"
            [attr.stroke-dasharray]="RING_C"
            [attr.stroke-dashoffset]="critDashOffset"
            transform="rotate(-90 26 26)"
          />
        </svg>
        <span class="activity-card__crit-seconds">
          {{ critSecondsLeft | number:'1.1-1' }}
        </span>
      </div>
      <!-- Label -->
      <div class="activity-card__crit-label">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <polygon points="8,1 10.2,6 15.5,6.6 11.5,10.4 12.6,15.5 8,12.8 3.4,15.5 4.5,10.4 0.5,6.6 5.8,6"/>
        </svg>
        CRIT! Click now
      </div>
    </div>
  }

  <!-- Top info -->
  <div class="activity-card__info">
    <span class="activity-card__action">{{ action() }}</span>
    <h2 class="activity-card__target">{{ target() }}</h2>
    <div class="activity-card__meta">
      @if (xp()) {
        <span class="activity-card__xp">{{ xp() }} Skill XP</span>
      }
      @if (xp() && duration()) {
        <span class="activity-card__sep">/</span>
      }
      @if (duration()) {
        <span class="activity-card__duration">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="8" cy="8" r="6.5"/>
            <path d="M8 4.5v3.75l2.5 1.5" stroke-linecap="round"/>
          </svg>
          {{ duration() }} seconds
        </span>
      }
    </div>
  </div>

  <!-- Image -->
  <div class="activity-card__image-wrap">
    @if (image()) {
      <img class="activity-card__image" [src]="image()" alt="" aria-hidden="true" />
    }
  </div>

  <!-- Smelting ingredients (middle) -->
  @if (type() === 'smelting' && inputItems().length) {
    <div class="activity-card__ingredients">
      @for (req of inputItems(); track req.item.id) {
        <div class="activity-card__ingredient"
             [class.activity-card__ingredient--short]="ingredientCount(req.item.id) < req.qty">
          <img class="activity-card__ingredient-icon" [src]="req.item.icon" alt="" aria-hidden="true" />
          <span class="activity-card__ingredient-count">
            {{ ingredientCount(req.item.id) }}<span class="activity-card__ingredient-req">/{{ req.qty }}</span>
          </span>
        </div>
      }
      <span class="activity-card__sets">
        {{ setsAvailable() ?? 0 }} set{{ (setsAvailable() ?? 0) !== 1 ? 's' : '' }}
      </span>
    </div>
  }

  <!-- Progress bar -->
  <div class="activity-card__progress-track">
    <div
      class="activity-card__progress-fill"
      [style.width.%]="progressPct()"
    ></div>
  </div>

  <!-- Depletion bar -->
  @if (type() === 'depletion') {
    <div class="activity-card__depletion">
      @if (isFullReplenishing()) {
        <div class="activity-card__charges activity-card__charges--replenishing">
          <div class="activity-card__replenish-track">
            <div class="activity-card__replenish-fill" [style.width.%]="displayReplenishPct()"></div>
          </div>
        </div>
        <span class="activity-card__charge-label activity-card__charge-label--replenishing">Replenishing…</span>
      } @else {
        <div class="activity-card__charges">
          @for (seg of chargeSegments(); track seg) {
            <div
              class="activity-card__charge"
              [class.activity-card__charge--filled]="seg < displayCharges()"
            ></div>
          }
        </div>
        <span class="activity-card__charge-label">{{ displayCharges() }}/{{ maxCharges() }}</span>
      }
    </div>
  }

  <!-- Bonus bar -->
  @if (type() === 'bonus') {
    <div class="activity-card__bonus">
      <div class="activity-card__charges">
        @for (seg of bonusSegments(); track seg) {
          <div
            class="activity-card__charge activity-card__charge--bonus"
            [class.activity-card__charge--bonus-filled]="seg < displayBonusStep()"
          ></div>
        }
      </div>
      <span class="activity-card__charge-label activity-card__charge-label--bonus">+{{ bonusXp() }} XP</span>
    </div>
  }

  <!-- Consumption counter -->
  @if (type() === 'consumption' && inputItemCount() !== null) {
    <div class="activity-card__consumption">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M8 2C8 2 4 6 4 9.5a4 4 0 0 0 8 0C12 6 8 2 8 2z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>{{ inputItemCount() }} remaining</span>
    </div>
  }

  <!-- Footer -->
  <div class="activity-card__footer">
    <div class="activity-card__requirements">
      @for (req of requirements(); track req.skill) {
        @if (req.level > 1) {
          <div class="activity-card__req" [title]="req.skill ? req.skill + ' ' + req.level : ''">
            <img class="activity-card__req-icon" [src]="req.icon" [alt]="req.skill ?? ''" aria-hidden="true" />
            <span class="activity-card__req-level">{{ req.level }}</span>
          </div>
        }
      }
    </div>
    <div class="activity-card__progress-label">
      @if (active() || isCrit()) {
        {{ progressPct() | number:'1.0-0' }}%
      } @else {
        0%
      }
    </div>
  </div>

</button>
