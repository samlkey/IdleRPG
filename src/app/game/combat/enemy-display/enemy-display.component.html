<div class="enemy-arena">
  @if (background()) {
    <img class="enemy-arena__bg" [src]="background()" alt="" aria-hidden="true" />
  }
  <div class="enemy-arena__overlay"></div>

  @if (monster(); as m) {
    <div class="enemy-arena__stage">
      <img
        class="enemy-arena__sprite"
        [src]="m.icon"
        [alt]="m.name"
        aria-hidden="true"
      />
    </div>

    <div class="enemy-arena__info">
      <div class="enemy-arena__name-row">
        <span class="enemy-arena__name">{{ m.name }}</span>
        <span class="enemy-arena__level">Lv. {{ m.level }}</span>
      </div>
      <div class="enemy-arena__hp-track">
        <div class="enemy-arena__hp-fill" [style.width.%]="hpPercent()"></div>
      </div>
      <span class="enemy-arena__hp-text">{{ currentHp() }} / {{ m.stats.health }} HP</span>
    </div>
  } @else {
    <div class="enemy-arena__empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9 9l6 6M15 9l-6 6"/>
      </svg>
      <span>No enemies here</span>
    </div>
  }
</div>
