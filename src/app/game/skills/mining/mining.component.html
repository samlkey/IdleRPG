<div class="skill-panel">
  <img
    class="skill-panel__bg"
    src="assets/backgrounds/mining.png"
    alt=""
    aria-hidden="true"
  />

  <div class="skill-panel__content">
    <div class="mining-layout">

      <div class="resource-detail">
        @if (selectedRock(); as rock) {
          <div class="activity-wrap">
            <app-activity
              [action]="'Mine'"
              [target]="rock.name"
              [dropTable]="rock.dropTable"
              [xp]="rock.xp"
              [duration]="rock.time"
              [image]="rock.src"
              [active]="activityService.current()?.name === rock.name"
              [requirements]="
                rock.level > 1
                  ? [{ icon: 'assets/icons/mining.png', level: rock.level, skill: 'Mining' }]
                  : []
              "
              [disabled]="skillData.level < rock.level"
              [type]="rock.type"
              [maxCharges]="rock.maxCharges"
              [replenishTime]="rock.replenishTime"
              (selected)="selectRock(rock)"
            />
          </div>
        } @else {
          <div class="resource-detail__empty">
            <p>Select a resource to begin mining</p>
          </div>
        }
      </div>

      <div class="resource-selector">
        <div class="resource-selector__header">Resources</div>
        <div class="resource-selector__list">
          @for (rock of rocks(); track rock.name) {
            <button
              class="resource-item"
              [class.resource-item--active]="selectedRock()?.name === rock.name"
              [class.resource-item--running]="activityService.current()?.name === rock.name"
              [class.resource-item--locked]="skillData.level < rock.level"
              (click)="selectedRock.set(rock)"
              type="button"
            >
              <img class="resource-item__icon" [src]="rock.src" [alt]="rock.name" />
              <div class="resource-item__info">
                <span class="resource-item__name">{{ rock.name }}</span>
                <div class="resource-item__stats">
                  <span class="resource-item__level">Lv {{ rock.level }}</span>
                  <span class="resource-item__xp">{{ rock.xp | number:'1.0-1' }} XP</span>
                </div>
              </div>
            </button>
          }
        </div>
      </div>

    </div>
  </div>
</div>
