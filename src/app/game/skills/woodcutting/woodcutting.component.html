<div class="skill-panel">
  <img
    class="skill-panel__bg"
    src="assets/backgrounds/woodcutting.png"
    alt=""
    aria-hidden="true"
  />

  <div class="skill-panel__content">
    <div class="woodcutting-layout">

      <div class="resource-detail">
        @if (selectedTree(); as tree) {
          <div class="activity-wrap">
            <app-activity
              [action]="'Cut'"
              [target]="tree.name"
              [dropTable]="tree.dropTable"
              [xp]="tree.xp"
              [duration]="tree.time"
              [image]="tree.src"
              [particleColors]="woodParticleColors"
              [active]="activityService.current()?.name === tree.name"
              [requirements]="
                tree.level > 1
                  ? [{ icon: 'assets/icons/woodcutting.png', level: tree.level, skill: 'Woodcutting' }]
                  : []
              "
              [disabled]="skillData.level < tree.level"
              (selected)="selectTree(tree)"
            />
          </div>
        } @else {
          <div class="resource-detail__empty">
            <p>Select a tree to begin woodcutting</p>
          </div>
        }
      </div>

      <div class="resource-selector">
        <div class="resource-selector__header">Trees</div>
        <div class="resource-selector__list">
          @for (tree of trees(); track tree.name) {
            <button
              class="resource-item"
              [class.resource-item--active]="selectedTree()?.name === tree.name"
              [class.resource-item--running]="activityService.current()?.name === tree.name"
              [class.resource-item--locked]="skillData.level < tree.level"
              (click)="selectedTree.set(tree)"
              type="button"
            >
              <img class="resource-item__icon" [src]="tree.src" [alt]="tree.name" />
              <div class="resource-item__info">
                <span class="resource-item__name">{{ tree.name }}</span>
                <div class="resource-item__stats">
                  <span class="resource-item__level">Lv {{ tree.level }}</span>
                  <span class="resource-item__xp">{{ tree.xp | number:'1.0-1' }} XP</span>
                </div>
              </div>
            </button>
          }
        </div>
      </div>

    </div>
  </div>
</div>
