<div class="fishing-location" [class.fishing-location--locked]="isLocationDisabled">

  <!-- Location hero -->
  <div class="fishing-location__hero">
    <img class="fishing-location__hero-bg" [src]="location().background" alt="" aria-hidden="true" />
    <div class="fishing-location__hero-overlay"></div>
    <div class="fishing-location__hero-content">
      <h3 class="fishing-location__name">{{ location().name }}</h3>
      @if (location().levelReq > 1) {
        <div class="fishing-location__level-badge">
          <img src="assets/icons/fishing.png" alt="" aria-hidden="true" />
          <span>Level {{ location().levelReq }}</span>
        </div>
      }
    </div>
  </div>

  <!-- Fish list -->
  <div class="fishing-location__fish-list">
    @for (fish of location().fish; track fish.name) {
      <button
        class="fishing-location__fish-row"
        [class.fishing-location__fish-row--active]="activeFish() === fish.name && !isCrit()"
        [class.fishing-location__fish-row--crit]="activeFish() === fish.name && isCrit()"
        [class.fishing-location__fish-row--caught]="caughtFish() === fish.name"
        [class.fishing-location__fish-row--locked]="isFishDisabled(fish)"
        [disabled]="isFishDisabled(fish) || isLocationDisabled"
        (click)="onRowClick(fish)"
        type="button"
      >
        <!-- Crit overlay -->
        @if (activeFish() === fish.name && isCrit()) {
          <div class="fishing-location__crit-overlay" aria-live="polite">
            <div class="fishing-location__crit-ring-wrap">
              <svg class="fishing-location__crit-ring" viewBox="0 0 52 52" aria-hidden="true">
                <circle cx="26" cy="26" r="22" fill="none" stroke="rgba(245,158,11,0.15)" stroke-width="4"/>
                <circle cx="26" cy="26" r="22" fill="none"
                  stroke="#fbbf24" stroke-width="4"
                  stroke-linecap="round"
                  [attr.stroke-dasharray]="RING_C"
                  [attr.stroke-dashoffset]="critDashOffset"
                  transform="rotate(-90 26 26)"
                />
              </svg>
              <span class="fishing-location__crit-seconds">{{ critSecondsLeft | number:'1.1-1' }}</span>
            </div>
            <div class="fishing-location__crit-label">
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <polygon points="8,1 10.2,6 15.5,6.6 11.5,10.4 12.6,15.5 8,12.8 3.4,15.5 4.5,10.4 0.5,6.6 5.8,6"/>
              </svg>
              CRIT! Click now
            </div>
          </div>
        }

        <!-- Fish image -->
        <div class="fishing-location__img-wrap">
          <img class="fishing-location__fish-img" [src]="fish.src" [alt]="fish.name" />
        </div>

        <!-- Name + meta -->
        <div class="fishing-location__fish-info">
          <span class="fishing-location__fish-name">{{ fish.name }}</span>
          <div class="fishing-location__fish-meta">
            <span>{{ fish.xp }} XP</span>
            <span class="fishing-location__fish-sep">/</span>
            <span>{{ fish.catchChance * 100 | number:'1.0-0' }}% catch</span>
          </div>
        </div>

        <!-- Throbber (right side, replaces XP badge) -->
        @if (activeFish() === fish.name && !isCrit()) {
          <svg class="fishing-location__throbber" viewBox="0 0 52 52" aria-hidden="true">
            <circle cx="26" cy="26" r="22" fill="none" stroke-width="3" stroke-linecap="round"
              stroke-dasharray="40 98" />
          </svg>
        }

        <!-- Level req badge -->
        @if (fish.level > 1 && activeFish() !== fish.name && caughtFish() !== fish.name) {
          <div class="fishing-location__fish-req" [title]="'Fishing ' + fish.level">
            <img src="assets/icons/fishing.png" alt="" aria-hidden="true" />
            <span>{{ fish.level }}</span>
          </div>
        }

      </button>
    }
  </div>

</div>
