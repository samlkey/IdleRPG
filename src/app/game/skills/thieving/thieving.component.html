<div class="skill-panel">
  <div class="skill-panel__hero">
    <img class="skill-panel__hero-bg" src="assets/backgrounds/thieving.png" alt="" aria-hidden="true" />
    <div class="skill-panel__hero-gradient"></div>
    <div class="skill-panel__header">
    <img class="skill-panel__pixel-icon" [src]="pixelIcon()" [alt]="pixelIcon()" aria-hidden="true" />
    <div>
      <h1 class="skill-panel__title">Thieving</h1>
      <p class="skill-panel__subtitle">Pickpocket and plunder for profit</p>
    </div>
    <button class="skill-panel__help" (click)="helpOpen.set(true)" aria-label="About Thieving">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
        <circle cx="12" cy="17" r=".5" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <div class="xp-bar">
    <div class="xp-bar__label">
      <span>Level 1</span>
      <span>0 / 83 XP</span>
    </div>
    <div class="xp-bar__track">
      <div class="xp-bar__fill" style="width: 0%"></div>
    </div>
  </div>

  <p class="placeholder">Thieving actions will appear here.</p>

</div>

@if (helpOpen()) {
  <app-modal title="Thieving" [icon]="pixelIcon()" (close)="helpOpen.set(false)">
    <p>Thieving allows you to pickpocket NPCs, steal from stalls, and crack safes. Higher levels grant access to wealthier targets and better rewards.</p>
  </app-modal>
}
