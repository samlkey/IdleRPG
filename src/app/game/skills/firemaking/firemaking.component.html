<div class="skill-panel">
  <img
    class="skill-panel__bg"
    src="assets/backgrounds/firemaking.png"
    alt=""
    aria-hidden="true"
  />

  <div class="skill-panel__content">
    <div class="firemaking-layout">

      <div class="resource-detail">
        @if (selectedLog(); as log) {
          <div class="activity-wrap">
            <app-activity
              [action]="'Burn'"
              [target]="log.item.name"
              [inputItem]="log.item"
              [xp]="log.xp"
              [duration]="log.time"
              [image]="log.src"
              [type]="'consumption'"
              [active]="activityService.current()?.name === log.item.name"
              [requirements]="
                log.level > 1
                  ? [{ icon: 'assets/icons/firemaking.png', level: log.level, skill: 'Firemaking' }]
                  : []
              "
              [disabled]="skillData.level < log.level"
              (selected)="selectLog(log)"
            />
          </div>
        } @else {
          <div class="resource-detail__empty">
            <p>Select a log to begin firemaking</p>
          </div>
        }
      </div>

      <div class="resource-selector">
        <div class="resource-selector__header">Logs</div>
        <div class="resource-selector__list">
          @for (log of allLogs; track log.item.id) {
            <button
              class="resource-item"
              [class.resource-item--active]="selectedLog()?.item?.id === log.item.id"
              [class.resource-item--running]="activityService.current()?.name === log.item.name"
              [class.resource-item--locked]="skillData.level < log.level"
              (click)="selectedLog.set(log)"
              type="button"
            >
              <img class="resource-item__icon" [src]="log.src" [alt]="log.item.name" />
              <div class="resource-item__info">
                <span class="resource-item__name">{{ log.item.name }}</span>
                <div class="resource-item__stats">
                  <span class="resource-item__level">Lv {{ log.level }}</span>
                  <span class="resource-item__xp">{{ log.xp | number:'1.0-1' }} XP</span>
                </div>
              </div>
            </button>
          }
        </div>
      </div>

    </div>
  </div>
</div>
